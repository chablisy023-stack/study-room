<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自习室 Study Room</title>
<meta name="description" content="线上自习室：在地图上和大家一起学习，攒金币解锁新城市 · Study together on a world map">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E7D5B'/%3E%3Cpath d='M9 24V10l7-4 7 4v14z' fill='%23fff'/%3E%3Crect x='14' y='17' width='4' height='7' fill='%232E7D5B'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============ 进入页 Join ============ -->
<section id="join" class="screen">
  <div class="join-top">
    <div class="seg lang-seg" role="group" data-i18n-aria="langGroup">
      <button type="button" data-action="lang" data-lang="zh" lang="zh">中文</button>
      <button type="button" data-action="lang" data-lang="en" lang="en">EN</button>
    </div>
  </div>
  <div class="join-wrap">
    <div class="join-intro">
      <svg class="join-logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#2E7D5B"/><path d="M13 36V16l11-6 11 6v20z" fill="#fff"/><rect x="21" y="26" width="6" height="10" fill="#2E7D5B"/></svg>
      <h1 data-i18n="headline"></h1>
      <p class="muted big" data-i18n="sub"></p>
      <p class="live-line"><span class="dot green"></span><span id="join-online"></span></p>
    </div>
    <form id="join-form" class="card join-card" autocomplete="off">
      <h2 data-i18n="formTitle"></h2>
      <label class="field"><span data-i18n="nick"></span>
        <input id="f-nick" maxlength="16" required data-i18n-ph="nickPh">
      </label>
      <label class="field"><span data-i18n="subj"></span>
        <input id="f-subj" maxlength="30" required data-i18n-ph="subjPh">
      </label>
      <fieldset class="builder picker">
        <legend data-i18n="pickTitle"></legend>
        <p class="muted small" data-i18n="pickHint"></p>
        <div class="map world mini" id="pick-map">
          <svg viewBox="0 0 1000 560" class="map-svg" id="pick-svg" aria-hidden="true"></svg>
          <div class="places" id="pick-cities"></div>
        </div>
        <p class="small pick-label" id="pick-places-label"></p>
        <div class="swatches" id="pick-places" role="group"></div>
      </fieldset>
      <fieldset class="builder">
        <legend data-i18n="look"></legend>
        <div class="builder-row">
          <div class="preview" id="avatar-preview"></div>
          <div class="builder-opts">
            <div class="opt-group"><span class="small muted" data-i18n="skin"></span><div class="swatches" id="sw-skin"></div></div>
            <div class="opt-group"><span class="small muted" data-i18n="hair"></span><div class="swatches" id="sw-hair"></div></div>
            <div class="opt-group"><span class="small muted" data-i18n="style"></span><div class="swatches" id="sw-style"></div></div>
            <div class="opt-group"><span class="small muted" data-i18n="shirt"></span><div class="swatches" id="sw-shirt"></div></div>
          </div>
        </div>
      </fieldset>
      <label class="check"><input type="checkbox" id="f-pomo"><span data-i18n="pomoOpt"></span></label>
      <p class="small pick-where" id="pick-where"></p>
      <button type="submit" class="btn primary big" data-i18n="enter"></button>
      <p class="muted small" data-i18n="note"></p>
    </form>
  </div>
</section>

<!-- ============ 主界面 Main ============ -->
<section id="town" class="screen" hidden>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#2E7D5B"/><path d="M13 36V16l11-6 11 6v20z" fill="#fff"/><rect x="21" y="26" width="6" height="10" fill="#2E7D5B"/></svg>
      <strong data-i18n="brand"></strong>
      <span class="online"><span class="dot green"></span><span id="online-count">0</span> <span data-i18n="online"></span></span>
      <span id="mode-tag" class="tag"></span>
    </div>
    <div class="top-actions">
      <span class="coin-pill" id="coin-pill"><span class="coin" aria-hidden="true"></span><span id="coin-count">0</span></span>
      <button type="button" class="btn ghost" id="pomo-toggle" data-action="pomo" aria-pressed="false"></button>
      <div class="seg lang-seg" role="group" data-i18n-aria="langGroup">
        <button type="button" data-action="lang" data-lang="zh" lang="zh">中文</button>
        <button type="button" data-action="lang" data-lang="en" lang="en">EN</button>
      </div>
      <button type="button" class="btn ghost" data-action="leave" data-i18n="leave"></button>
    </div>
  </header>

  <main class="layout">
    <section class="main-col">
      <div class="session card">
        <div class="session-info">
          <span class="muted" id="s-where"></span>
          <strong id="s-subject"></strong>
          <span class="muted small" data-i18n="elapsed"></span>
          <span class="timer mono" id="s-timer">00:00:00</span>
        </div>
        <div class="session-actions">
          <span class="status-pill" id="s-status"></span>
          <button type="button" class="btn ghost" data-action="pause" id="pause-btn"></button>
          <button type="button" class="btn primary" data-action="end" data-i18n="end"></button>
        </div>
      </div>

      <div class="pomo card" id="pomo-panel" hidden>
        <div>
          <strong class="warm" id="pomo-title"></strong>
          <p class="muted small" data-i18n="pomoDesc"></p>
        </div>
        <span class="mono pomo-clock" id="pomo-clock">25:00</span>
      </div>

      <div class="map-card card">
        <div class="map-head">
          <div class="crumbs">
            <button type="button" class="btn ghost small-btn" data-action="world" id="world-btn"></button>
            <h2 id="map-title"></h2>
          </div>
          <div class="sound-ctl">
            <button type="button" class="btn ghost small-btn" data-action="sound" id="sound-btn" aria-pressed="false"></button>
            <label class="vol"><span class="sr" data-i18n="volume"></span><input type="range" id="vol" min="0" max="100" value="50"></label>
          </div>
        </div>
        <p class="muted small map-hint" id="map-hint"></p>
        <div class="map" id="map">
          <svg viewBox="0 0 1000 640" class="map-svg" id="map-svg" role="img" data-i18n-aria="mapAria"></svg>
          <div class="places" id="places"></div>
          <div class="avatars" id="avatars"></div>
        </div>
        <div class="unlock card" id="unlock" hidden>
          <div class="row-between">
            <strong id="unlock-title"></strong>
            <button type="button" class="btn ghost small-btn" data-action="close-unlock" data-i18n="close"></button>
          </div>
          <div class="unlock-body">
            <div class="unlock-opt">
              <button type="button" class="btn primary" data-action="buy" id="buy-btn"></button>
              <span class="small muted" id="buy-note"></span>
            </div>
            <div class="unlock-opt">
              <span class="small" id="quest-text"></span>
              <div class="bar"><span id="quest-bar"></span></div>
              <span class="small muted" id="quest-progress"></span>
              <button type="button" class="btn ghost" data-action="quest" id="quest-btn" data-i18n="unlockFree"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-col">
      <div class="card">
        <div class="row-between">
          <h2 data-i18n="leaderboard"></h2>
          <div class="seg" role="group">
            <button type="button" data-action="tab-today" id="tab-today" data-i18n="today"></button>
            <button type="button" data-action="tab-week" id="tab-week" data-i18n="week"></button>
          </div>
        </div>
        <ol class="board" id="board"></ol>
        <div class="row-between checkin">
          <span class="muted" id="checkin-text"></span>
          <span id="checkin-badge" class="badge"></span>
        </div>
      </div>

      <div class="card chat">
        <h2 data-i18n="chat"></h2>
        <div class="messages" id="messages" aria-live="polite"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <label for="chat-input" class="muted small" data-i18n="rules"></label>
          <div class="chat-row">
            <input id="chat-input" maxlength="200" data-i18n-ph="chatPh">
            <button type="submit" class="btn primary" data-i18n="send"></button>
          </div>
          <span class="small warm" id="chat-hint" role="status"></span>
        </form>
      </div>
    </aside>
  </main>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
